services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: odonto_simulator
      POSTGRES_USER: simulator
      POSTGRES_PASSWORD: simulator
      TZ: America/Lima
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simulator -d odonto_simulator"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - odonto_simulator_data:/var/lib/postgresql/data

volumes:
  odonto_simulator_data:
