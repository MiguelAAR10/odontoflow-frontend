<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" class="pj-pasta">
  <title>Pasta dental rosa · Cobranza (flat)</title>
  <desc>Variante plana del personaje 03 para 32–48 px: seis colores sólidos (rosa, rosa profundo de borde, crema de la franja, blanco de tapa, lavanda de borde y estrías, negro de ojos). Construcción tipo pegatina: cada pieza en su color de borde y la cara desplazada arriba/izquierda; la base sellada se separa con un trazo del color de borde. Sin destellos ni degradados. Misma silueta y mismos IDs que la premium; ojos un 8 % más anchos.</desc>
