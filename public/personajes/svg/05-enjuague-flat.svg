  <title>Enjuague bucal · Caja (flat)</title>
  <desc>Variante plana del personaje 05 para 32–48 px: seis colores sólidos (rojo oscuro de borde, rojo, panel rojo profundo, lavanda de borde de tapa, tapa marfil, negro de ojos); construcción tipo pegatina: silueta oscura y cara desplazada arriba/izquierda, sin burbujas, destellos ni degradados. Misma silueta y mismos IDs que la premium; ojos un 8 % más anchos.</desc>

