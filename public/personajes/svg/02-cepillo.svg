      </g>
    </g>

    <g id="character-details">
      <g id="bristles">
        <path id="bristle-3" fill="url(#cp-bristle)" d="M576.3 295.1 L709.6 362.5 C734.7 375.1 744.8 405.8 732.1 430.9 C719.5 455.9 688.8 466 663.8 453.3 L552.3 397 C544.4 393 540.7 383.2 544 375 Z"/>
        <path id="bristle-groove-3" fill="#D6E0F0" clip-path="url(#cp-clip-b3)" d="M603.8 226.9 L732.3 280.7 C760.3 292.4 773.5 324.6 761.8 352.6 C750.1 380.6 717.9 393.8 689.9 382.1 L562.6 328.8 Z"/>
        <path id="bristle-2" fill="url(#cp-bristle)" d="M609.4 213 L738.1 266.8 C766.1 278.6 779.3 310.7 767.6 338.7 C755.9 366.7 723.7 379.9 695.7 368.2 L568.2 314.9 Z"/>
        <path id="bristle-groove-2" fill="#D6E0F0" clip-path="url(#cp-clip-b2)" d="M636.6 145.7 L766.5 187.2 C795.3 196.4 811.2 227.2 802 256 C792.8 284.9 762 300.8 733.2 291.6 L595.4 247.6 Z"/>
        <path id="bristle-1" fill="url(#cp-bristle)" d="M655.6 136 L771.1 172.9 C799.9 182.1 815.8 212.9 806.6 241.7 C797.4 270.6 766.6 286.5 737.7 277.3 L601.1 233.7 L637 144.8 C639.9 137.6 648.2 133.7 655.6 136 Z"/>
        <rect id="bristle-shade" clip-path="url(#cp-clip-bristles)" x="540" y="120" width="290" height="360" fill="url(#cp-bristle-tip)"/>
      </g>
      <rect id="highlight-arc" fill="#D8FFFD" x="-78" y="-11" width="156" height="22" rx="11" transform="translate(296 690) rotate(-65)"/>
      <ellipse id="highlight-dot" fill="#D8FFFD" cx="520" cy="166" rx="11" ry="22" transform="rotate(23 520 166)"/>
    </g>

    <g id="eyes">
      <g id="eyes-state">
        <g id="eye-left" transform="translate(394.2 560.3) rotate(22)">
          <rect class="eye" x="-22" y="-40" width="44" height="80" rx="22" fill="#020204"/>
