        <rect x="220" y="80" width="460" height="880" fill="url(#cp-shade-right)"/>
        <path id="head-side" fill="#04ADCE" d="M618 152 C628 140 640 132 668 126 L566 412 L522 384 Z"/>
        <circle cx="505" cy="405" r="78" fill="url(#cp-shade-neck)"/>
