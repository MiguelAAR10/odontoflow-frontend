<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" class="pj-pasta">
  <title>Pasta dental rosa · Cobranza</title>
  <desc>Personaje 03 de la familia OdontoFlow: tubo de pasta rosa intenso inclinado como si bailara, hombros redondeados, base sellada más ancha, franja blanca ondulante en diagonal, tapa blanca con estrías lavanda y dos bracitos cortos detrás del tubo. Dos ojos cápsula negros sobre la franja. Dos destellos blancos de cuatro puntas. Luz arriba/izquierda. SVG nativo dibujado a mano; la animación vive fuera, en personajes.css y personajes-A.css.</desc>
  <defs>
    <!-- Base: canto izquierdo rosa claro hacia rosa intenso (perpendicular al eje del tubo, inclinado 18,5°) -->
    <linearGradient id="ps-base" gradientUnits="userSpaceOnUse" x1="300" y1="550" x2="670" y2="674">
      <stop offset="0" stop-color="#FD88BF"/>
      <stop offset="0.09" stop-color="#FB64A7"/>
      <stop offset="0.4" stop-color="#FA559B"/>
      <stop offset="1" stop-color="#F74B93"/>
    </linearGradient>
    <!-- Sombra del material: canto derecho rosa profundo -->
    <linearGradient id="ps-shade-right" gradientUnits="userSpaceOnUse" x1="702" y1="235" x2="815" y2="273">
      <stop offset="0" stop-color="#E0397D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#DE367B" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#D92376" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Pliegue: sombra de la tapa sobre los hombros -->
    <linearGradient id="ps-shade-cap" gradientUnits="userSpaceOnUse" x1="606" y1="236" x2="597" y2="288">
      <stop offset="0" stop-color="#D92376" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#D92376" stop-opacity="0"/>
    </linearGradient>
    <!-- Franja blanca: rosa crema, más rosada hacia la derecha -->
    <linearGradient id="ps-band" gradientUnits="userSpaceOnUse" x1="260" y1="640" x2="760" y2="520">
      <stop offset="0" stop-color="#FFEAF4"/>
      <stop offset="0.6" stop-color="#FDDCEC"/>
      <stop offset="1" stop-color="#FBD0E5"/>
    </linearGradient>
    <!-- Base sellada: rosa algo más profundo, canto superior claro -->
    <linearGradient id="ps-seal" gradientUnits="userSpaceOnUse" x1="300" y1="720" x2="560" y2="960">
      <stop offset="0" stop-color="#FB5CA2"/>
      <stop offset="0.3" stop-color="#F84991"/>
      <stop offset="1" stop-color="#E9367F"/>
    </linearGradient>
    <!-- Brazos: punta iluminada, raíz en sombra junto al tubo -->
    <linearGradient id="ps-arm-left" gradientUnits="userSpaceOnUse" x1="215" y1="380" x2="330" y2="500">
      <stop offset="0" stop-color="#FC71B0"/>
      <stop offset="0.55" stop-color="#F9519A"/>
      <stop offset="1" stop-color="#E23C82"/>
    </linearGradient>
    <linearGradient id="ps-arm-right" gradientUnits="userSpaceOnUse" x1="700" y1="560" x2="850" y2="610">
      <stop offset="0" stop-color="#E23C82"/>
      <stop offset="0.35" stop-color="#F9519A"/>
      <stop offset="1" stop-color="#F7478F"/>
    </linearGradient>
    <!-- Tapa: blanco arriba/izquierda, lavanda a la derecha -->
    <linearGradient id="ps-cap" gradientUnits="userSpaceOnUse" x1="500" y1="120" x2="725" y2="200">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F8F2FA"/>
      <stop offset="1" stop-color="#E8DAF4"/>
    </linearGradient>
    <linearGradient id="ps-star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#FFF6F9"/>
      <stop offset="1" stop-color="#FFDDEB"/>
    </linearGradient>
    <clipPath id="ps-clip-body">
      <path d="M476 204 L709 250 L710 264 C739 281 757 300 756 335 C745 400 676 715 655 857 L645 885 L250 795 L241 735 C284 571 337 413 398 257 C416 222 438 209 476 204 Z"/>
    </clipPath>
    <clipPath id="ps-clip-cap">
      <path d="M561 77 C622 74 683 90 713 118 C723 128 725 144 723 159 L711 247 C709 258 702 263 692 262 C640 258 560 236 500 213 C490 209 485 201 488 192 L526 101 C532 87 545 78 561 77 Z"/>
    </clipPath>
  </defs>

  <g id="decorations-back">
    <g id="sparkle-back">
      <path fill="url(#ps-star)" d="M328.5 188.5 C331.3 184.0 336.7 184.0 339.5 188.5 C342.0 207.8 353.7 220.4 371.8 223.2 C376.0 226.1 376.0 231.9 371.8 234.8 C353.7 237.6 342.0 250.2 339.5 269.5 C336.7 274.0 331.3 274.0 328.5 269.5 C326.0 250.2 314.3 237.6 296.2 234.8 C292.0 231.9 292.0 226.1 296.2 223.2 C314.3 220.4 326.0 207.8 328.5 188.5 Z"/>
    </g>
  </g>

  <g id="character">
    <g id="arm-left">
      <path fill="url(#ps-arm-left)" d="M299 531 C267 512 246 500 225 467 C211 445 198 413 209 387 C219 365 244 354 267 364 C296 377 300 418 330 438 L362 470 L342 548 Z"/>
    </g>
    <g id="arm-right">
      <path fill="url(#ps-arm-right)" d="M712 553 C740 551 770 530 797 525 C825 520 851 536 850 566 C849 598 817 620 791 632 C759 646 727 649 693 650 L662 640 L684 540 Z"/>
    </g>

    <g id="character-body">
      <path id="body-shape" fill="url(#ps-base)" d="M476 204 L709 250 L710 264 C739 281 757 300 756 335 C745 400 676 715 655 857 L645 885 L250 795 L241 735 C284 571 337 413 398 257 C416 222 438 209 476 204 Z"/>
      <g id="body-shade" clip-path="url(#ps-clip-body)">
        <path id="band" fill="url(#ps-band)" d="M230 676 C300 610 380 570 470 543 C560 517 690 502 770 412 L790 545 C720 590 680 612 610 627 C520 645 430 655 366 695 C326 720 296 748 238 800 Z"/>
        <rect x="560" y="200" width="240" height="700" fill="url(#ps-shade-right)"/>
        <path fill="url(#ps-shade-cap)" d="M470 196 C540 228 640 256 720 262 L720 300 C640 296 540 272 450 236 Z"/>
      </g>
      <path id="body-base" fill="url(#ps-seal)" d="M657 842 C655 862 663 881 659 900 C656 917 646 925 630 927 C577 933 293 846 242 816 C228 808 219 800 219 783 C219 765 232 748 242 733 C380 765 520 805 657 842 Z"/>
    </g>

    <g id="cap">
      <path id="cap-shape" fill="url(#ps-cap)" d="M561 77 C622 74 683 90 713 118 C723 128 725 144 723 159 L711 247 C709 258 702 263 692 262 C640 258 560 236 500 213 C490 209 485 201 488 192 L526 101 C532 87 545 78 561 77 Z"/>
      <g id="cap-ridges" clip-path="url(#ps-clip-cap)">
        <path fill="#EADDF5" d="M514.5 253.9 L569.3 111.2 C571.5 105.5 568.7 99.2 563 97 C557.3 94.8 551 97.7 548.8 103.3 L494 246.1 Z"/>
        <path fill="#E4D4F2" d="M573 272.3 L627.2 123.4 C629.4 117.1 626.2 110.3 620 108 C613.8 105.7 606.9 108.9 604.6 115.2 L550.5 264.1 Z"/>
        <path fill="#D7C1EC" d="M653.2 294.3 L687.6 138.7 C689.3 131.1 684.5 123.7 677 122 C669.5 120.3 662 125.1 660.3 132.6 L625.8 288.3 Z"/>
      </g>
    </g>

    <g id="character-details">
      <rect id="highlight-arc" fill="#FFD3E8" x="-58" y="-13" width="116" height="26" rx="13" transform="translate(395 345) rotate(-71.8)"/>
      <ellipse id="highlight-dot" fill="#FFD3E8" cx="432" cy="250" rx="13" ry="22" transform="rotate(35 432 250)"/>
    </g>

    <g id="eyes">
      <g id="eyes-state">
        <g id="eye-left" transform="translate(486.8 368.6) rotate(18.3)">
          <rect class="eye" x="-29" y="-52" width="58" height="104" rx="29" fill="#020204"/>
        </g>
        <g id="eye-right" transform="translate(591.8 394.1) rotate(17.8)">
          <rect class="eye" x="-29" y="-52" width="58" height="104" rx="29" fill="#020204"/>
        </g>
      </g>
    </g>
  </g>

  <g id="decorations-front">
    <g id="sparkle-front">
      <path fill="url(#ps-star)" d="M743.5 697.5 C746.3 693.0 751.7 693.0 754.5 697.5 C757.0 716.9 768.7 729.5 786.8 732.1 C791.0 735.1 791.0 740.9 786.8 743.9 C768.7 746.5 757.0 759.1 754.5 778.5 C751.7 783.0 746.3 783.0 743.5 778.5 C741.0 759.1 729.3 746.5 711.2 743.9 C707.0 740.9 707.0 735.1 711.2 732.1 C729.3 729.5 741.0 716.9 743.5 697.5 Z"/>
    </g>
  </g>
</svg>
