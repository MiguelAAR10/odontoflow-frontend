<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" class="pj-hilo">
  <title>Hilo dental amarillo · Confirmaciones (flat)</title>
  <desc>Variante plana del personaje 04 para 32–48 px: cinco colores sólidos (amarillo, amarillo profundo de borde, amarillo profundo del interior de la tapa, blanco de la hebra, negro de ojos). Construcción tipo pegatina: tapa y estuche en su color de borde con la cara desplazada arriba/izquierda; la hebra se engrosa y lleva contorno amarillo profundo para leerse también sobre blanco. Sin destellos ni degradados. Misma silueta y mismos IDs que la premium; ojos un 8 % más anchos. v2 (2026-10-13, RECOLOR-FAMILIA): paleta única de 5 colores intensos + neutros, reflejos satinados y grano fino (.pj-grain, se apaga a ≤ 24 px); geometría e IDs de v1 intactos.</desc>
