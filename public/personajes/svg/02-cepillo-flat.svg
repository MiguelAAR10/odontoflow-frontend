<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" class="pj-cepillo">
  <title>Cepillo turquesa · Agenda (flat)</title>
  <desc>Variante plana del personaje 02 para 32–48 px: seis colores sólidos (turquesa, turquesa profundo de borde y sombra, blanco de cerdas, azul perla de borde de cerdas, negro de ojos). Construcción tipo pegatina: silueta en el color de borde y cara desplazada arriba/izquierda; surcos de las cerdas marcados por el borde de cada mechón. Sin destellos ni degradados. Misma silueta y mismos IDs que la premium; ojos un 8 % más anchos.</desc>
