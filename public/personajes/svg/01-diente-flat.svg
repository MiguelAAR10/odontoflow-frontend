<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Diente brillante · AIRI (flat)</title>
  <desc>Variante plana del personaje 01 para 32–48 px: cuatro colores sólidos (marfil, perla claro, azul borde, negro de ojos); construcción tipo pegatina: silueta azul y cara marfil desplazada arriba/izquierda, así el borde se lee también sobre blanco, sin destellos ni degradados. Misma silueta, mismos IDs que la premium; ojos un 8 % más anchos para leer pequeño.</desc>
