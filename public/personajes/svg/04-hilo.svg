<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" class="pj-hilo">
  <title>Hilo dental amarillo · Confirmaciones</title>
  <desc>Personaje 04 de la familia OdontoFlow: dispensador de hilo dental amarillo intenso, estuche de esquinas muy redondas en tres cuartos con cara frontal más clara, tapa abierta detrás con interior ámbar y borde claro, y una hebra blanca gruesa que sale del estuche, hace un arco y cae a la izquierda en un gancho de punta redonda. Dos ojos cápsula negros en la cara frontal. Destello amarillo a la izquierda y menta a la derecha. Luz arriba/izquierda. SVG nativo dibujado a mano; la animación vive fuera, en personajes.css y personajes-A.css.</desc>
  <defs>
    <!-- Tapa: canto superior claro hacia amarillo base (perpendicular a la tapa, inclinada −16°) -->
    <linearGradient id="hl-lid" gradientUnits="userSpaceOnUse" x1="480" y1="232" x2="519" y2="366">
      <stop offset="0" stop-color="#FFE47E"/>
      <stop offset="0.35" stop-color="#FFD23C"/>
      <stop offset="1" stop-color="#FFC21A"/>
    </linearGradient>
    <!-- Interior de la tapa: ámbar profundo, pared derecha iluminada -->
    <linearGradient id="hl-lid-inner" gradientUnits="userSpaceOnUse" x1="320" y1="420" x2="760" y2="300">
      <stop offset="0" stop-color="#F29400"/>
      <stop offset="0.7" stop-color="#E88600"/>
      <stop offset="1" stop-color="#F7A60C"/>
    </linearGradient>
    <!-- Paredes del estuche (tres cuartos): ámbar hacia abajo/derecha -->
    <linearGradient id="hl-side" gradientUnits="userSpaceOnUse" x1="360" y1="520" x2="800" y2="820">
      <stop offset="0" stop-color="#FFC628"/>
      <stop offset="0.5" stop-color="#F9AE05"/>
      <stop offset="1" stop-color="#EC9B00"/>
    </linearGradient>
    <!-- Cara frontal: más clara arriba/izquierda -->
    <linearGradient id="hl-face" gradientUnits="userSpaceOnUse" x1="430" y1="470" x2="830" y2="760">
      <stop offset="0" stop-color="#FFD957"/>
      <stop offset="0.38" stop-color="#FFCB2C"/>
      <stop offset="1" stop-color="#FFBE16"/>
    </linearGradient>
    <!-- Sombra del material: borde inferior del estuche -->
    <linearGradient id="hl-shade-bottom" gradientUnits="userSpaceOnUse" x1="0" y1="640" x2="0" y2="850">
      <stop offset="0" stop-color="#E89B00" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#E89B00" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#DE8D00" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Pliegue: la tapa se mete detrás del estuche -->
    <radialGradient id="hl-shade-hinge" gradientUnits="userSpaceOnUse" cx="760" cy="392" r="90">
      <stop offset="0" stop-color="#E89B00" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#E89B00" stop-opacity="0"/>
    </radialGradient>
    <!-- Hebra: blanco, sombra fría abajo/derecha -->
    <linearGradient id="hl-thread" gradientUnits="userSpaceOnUse" x1="200" y1="380" x2="430" y2="700">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F9FAFD"/>
      <stop offset="1" stop-color="#DCE3F0"/>
    </linearGradient>
    <linearGradient id="hl-star-warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE88A"/>
      <stop offset="0.5" stop-color="#FFDA55"/>
      <stop offset="1" stop-color="#FFB53D"/>
    </linearGradient>
    <linearGradient id="hl-star-mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BF7DA"/>
      <stop offset="0.5" stop-color="#45E5BC"/>
      <stop offset="1" stop-color="#22CFA2"/>
    </linearGradient>
    <clipPath id="hl-clip-body">
      <path d="M430 476 L744 391 C770 384 812 383 828 400 C848 425 882 595 884 632 C887 677 868 716 836 747 C777 805 627 839 546 843 C509 845 469 835 439 811 C391 772 350 659 341 598 C336 562 349 547 370 521 C385 500 405 484 430 476 Z"/>
    </clipPath>
  </defs>

  <g id="decorations-back">
    <g id="sparkle-back">
      <path fill="url(#hl-star-warm)" d="M238.4 238.4 C241.0 234.0 246.0 234.0 248.6 238.4 C250.9 257.3 261.8 269.6 278.6 272.3 C282.5 275.1 282.5 280.9 278.6 283.7 C261.8 286.4 250.9 298.7 248.6 317.6 C246.0 322.0 241.0 322.0 238.4 317.6 C236.1 298.7 225.2 286.4 208.4 283.7 C204.5 280.9 204.5 275.1 208.4 272.3 C225.2 269.6 236.1 257.3 238.4 238.4 Z"/>
    </g>
  </g>

  <g id="character">
    <g id="lid">
      <path id="lid-shape" fill="url(#hl-lid)" d="M372 513 C345 511 318 495 301 474 C286 454 273 405 274 380 C276 343 304 308 332 287 C384 250 615 190 681 184 C746 179 791 221 793 285 C794 323 793 360 789 396 L700 440 L430 525 Z"/>
      <path id="lid-inner" fill="url(#hl-lid-inner)" d="M372 342 L712 245 C740 238 758 258 759 290 L758 362 L420 520 L362 498 C333 486 317 460 318 430 C320 384 338 352 372 342 Z"/>
    </g>

    <g id="thread">
      <path id="thread-edge" fill="none" stroke="#C9D3E6" stroke-width="41" stroke-linecap="round" stroke-linejoin="round" d="M540 482 C541 420 512 373 461 373 C410 373 368 405 350 440 C336 470 324 520 314 556 C300 610 270 668 199 669 C158 670 132 646 133 603"/>
      <path id="thread-strand" fill="none" stroke="url(#hl-thread)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" d="M540 482 C541 420 512 373 461 373 C410 373 368 405 350 440 C336 470 324 520 314 556 C300 610 270 668 199 669 C158 670 132 646 133 603"/>
    </g>

    <g id="character-body">
      <path id="body-shape" fill="url(#hl-side)" d="M430 476 L744 391 C770 384 812 383 828 400 C848 425 882 595 884 632 C887 677 868 716 836 747 C777 805 627 839 546 843 C509 845 469 835 439 811 C391 772 350 659 341 598 C336 562 349 547 370 521 C385 500 405 484 430 476 Z"/>
      <g id="body-shade" clip-path="url(#hl-clip-body)">
        <rect x="330" y="620" width="570" height="240" fill="url(#hl-shade-bottom)"/>
        <circle cx="760" cy="392" r="90" fill="url(#hl-shade-hinge)"/>
      </g>
      <path id="body-face" fill="url(#hl-face)" transform="translate(97.1 89) scale(0.8766 0.835)" d="M430 476 L744 391 C770 384 812 383 828 400 C848 425 882 595 884 632 C887 677 868 716 836 747 C777 805 627 839 546 843 C509 845 469 835 439 811 C391 772 350 659 341 598 C336 562 349 547 370 521 C385 500 405 484 430 476 Z"/>
    </g>

    <g id="character-details">
      <rect id="highlight-arc" fill="#FFF1B8" x="-46" y="-11" width="92" height="22" rx="11" transform="translate(463 521) rotate(-42)"/>
      <ellipse id="highlight-dot" fill="#FFF1B8" cx="318" cy="330" rx="12" ry="24" transform="rotate(38 318 330)"/>
    </g>

    <g id="eyes">
      <g id="eyes-state">
        <g id="eye-left" transform="translate(638.3 601.8) rotate(-15.5)">
          <rect class="eye" x="-31" y="-56" width="62" height="112" rx="31" fill="#020204"/>
        </g>
        <g id="eye-right" transform="translate(746.3 572.2) rotate(-15.8)">
          <rect class="eye" x="-31" y="-56" width="62" height="112" rx="31" fill="#020204"/>
        </g>
      </g>
    </g>
  </g>

  <g id="decorations-front">
    <g id="sparkle-front">
      <path fill="url(#hl-star-mint)" d="M912.8 480.2 C914.9 476.5 919.1 476.5 921.2 480.2 C923.1 496.1 932.0 506.5 945.8 508.7 C949.0 511.1 949.0 515.9 945.8 518.3 C932.0 520.5 923.1 530.9 921.2 546.8 C919.1 550.5 914.9 550.5 912.8 546.8 C910.9 530.9 902.0 520.5 888.2 518.3 C885.0 515.9 885.0 511.1 888.2 508.7 C902.0 506.5 910.9 496.1 912.8 480.2 Z"/>
    </g>
  </g>
</svg>
