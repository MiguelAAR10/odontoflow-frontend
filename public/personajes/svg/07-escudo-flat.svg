<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" class="pj-escudo">
  <title>Escudo protector · Identidad (flat)</title>
  <desc>Variante plana del personaje 07 para 32–48 px: cinco colores sólidos (esmeralda de borde, verde menta, faceta verde, panel menta claro, negro de ojos); construcción tipo pegatina: silueta esmeralda y cara desplazada arriba/izquierda, sin destellos ni degradados. Misma silueta y mismos IDs que la premium; ojos un 8 % más anchos.</desc>
