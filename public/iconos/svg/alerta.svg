<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
<title>Alerta</title>
<desc>Icono clay OdontoFlow · rojo. Colores por variables CSS --ic-*.</desc>
<defs>
<radialGradient id="clay-light" cx=".3" cy=".24" r=".78" fx=".28" fy=".18">
  <stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".4" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<filter id="clay-grain" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="1" seed="7" result="n"/>
  <feColorMatrix in="n" type="matrix" values="1.6 0 0 0 -0.3 1.6 0 0 0 -0.3 1.6 0 0 0 -0.3 0 0 0 0 1" result="g"/>
  <feComposite in="g" in2="SourceAlpha" operator="in" result="m"/>
  <feBlend in="m" in2="SourceGraphic" mode="soft-light"/>
</filter>
</defs>
  <g class="clay" style="filter:var(--ic-grain,url(#clay-grain))"><g transform="translate(1.6 2.4)" style="fill:var(--ic-dk,#D9273A);stroke:var(--ic-dk,#D9273A)"><path d="M48 16 L84 78 L12 78 Z" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/></g><g style="fill:var(--ic-base,#FF514F);stroke:var(--ic-base,#FF514F)"><path d="M48 16 L84 78 L12 78 Z" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/></g><g style="fill:url(#clay-light);stroke:url(#clay-light);opacity:var(--ic-light,1)"><path d="M48 16 L84 78 L12 78 Z" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/></g></g>
  <g style="stroke:var(--ic-on,#FCFCFF);fill:none"><path d="M48 38 V56" fill="none" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><circle cx="48" cy="68" r="5" stroke="none" style="fill:var(--ic-on,#FCFCFF)"/></g>
  <g class="hl" fill="#fff" style="opacity:var(--ic-hl,.5)"><rect x="-4.5" y="-3" width="9" height="6" rx="3" transform="translate(38 36) rotate(-60)"/></g>
</svg>
