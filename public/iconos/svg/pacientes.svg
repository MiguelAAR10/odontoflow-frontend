<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
<title>Pacientes</title>
<desc>Icono clay OdontoFlow · morado. Colores por variables CSS --ic-*.</desc>
<defs>
<radialGradient id="clay-light" cx=".3" cy=".24" r=".78" fx=".28" fy=".18">
  <stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".4" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<filter id="clay-grain" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="1" seed="7" result="n"/>
  <feColorMatrix in="n" type="matrix" values="1.6 0 0 0 -0.3 1.6 0 0 0 -0.3 1.6 0 0 0 -0.3 0 0 0 0 1" result="g"/>
  <feComposite in="g" in2="SourceAlpha" operator="in" result="m"/>
  <feBlend in="m" in2="SourceGraphic" mode="soft-light"/>
</filter>
</defs>
  <g class="clay" style="filter:var(--ic-grain,url(#clay-grain))"><g transform="translate(1.6 2.4)" style="fill:var(--ic-dk,#6531D7);stroke:var(--ic-dk,#6531D7)"><circle cx="48" cy="31" r="17" stroke="none"/><path d="M19 80 C19 63 31 54 48 54 C65 54 77 63 77 80 Z" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/></g><g style="fill:var(--ic-base,#9656F1);stroke:var(--ic-base,#9656F1)"><circle cx="48" cy="31" r="17" stroke="none"/><path d="M19 80 C19 63 31 54 48 54 C65 54 77 63 77 80 Z" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/></g><g style="fill:url(#clay-light);stroke:url(#clay-light);opacity:var(--ic-light,1)"><circle cx="48" cy="31" r="17" stroke="none"/><path d="M19 80 C19 63 31 54 48 54 C65 54 77 63 77 80 Z" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/></g></g>
  <g class="hl" fill="#fff" style="opacity:var(--ic-hl,.5)"><rect x="-4.5" y="-3" width="9" height="6" rx="3" transform="translate(39 22) rotate(-40)"/><rect x="-4.5" y="-3" width="9" height="6" rx="3" transform="translate(27 66) rotate(-55)"/></g>
</svg>
