<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
<title>Nueva cita</title>
<desc>Icono clay OdontoFlow · turquesa. Colores por variables CSS --ic-*.</desc>
<defs>
<radialGradient id="clay-light" cx=".3" cy=".24" r=".78" fx=".28" fy=".18">
  <stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".4" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<filter id="clay-grain" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="1" seed="7" result="n"/>
  <feColorMatrix in="n" type="matrix" values="1.6 0 0 0 -0.3 1.6 0 0 0 -0.3 1.6 0 0 0 -0.3 0 0 0 0 1" result="g"/>
  <feComposite in="g" in2="SourceAlpha" operator="in" result="m"/>
  <feBlend in="m" in2="SourceGraphic" mode="soft-light"/>
</filter>
</defs>
  <g class="clay" style="filter:var(--ic-grain,url(#clay-grain))"><g transform="translate(1.6 2.4)" style="fill:var(--ic-dk,#08AEC7);stroke:var(--ic-dk,#08AEC7)"><rect x="8" y="18" width="62" height="56" rx="14" stroke="none"/></g><g style="fill:var(--ic-base,#20DCE2);stroke:var(--ic-base,#20DCE2)"><rect x="8" y="18" width="62" height="56" rx="14" stroke="none"/></g><g style="fill:url(#clay-light);stroke:url(#clay-light);opacity:var(--ic-light,1)"><rect x="8" y="18" width="62" height="56" rx="14" stroke="none"/></g></g>
  <g class="clay" style="filter:var(--ic-grain,url(#clay-grain))"><g transform="translate(1.6 2.4)" style="fill:var(--ic-on-dk,#C6D3FF);stroke:var(--ic-on-dk,#C6D3FF)"><rect x="16" y="35" width="46" height="31" rx="8" stroke="none"/></g><g style="fill:var(--ic-on,#FCFCFF);stroke:var(--ic-on,#FCFCFF)"><rect x="16" y="35" width="46" height="31" rx="8" stroke="none"/></g><g style="fill:url(#clay-light);stroke:url(#clay-light);opacity:var(--ic-light,1)"><rect x="16" y="35" width="46" height="31" rx="8" stroke="none"/></g></g>
  <g class="clay" style="filter:var(--ic-grain,url(#clay-grain))"><g transform="translate(1.6 2.4)" style="fill:var(--ic-pc-dk,#C6D3FF);stroke:var(--ic-pc-dk,#C6D3FF)"><rect x="20" y="9" width="10" height="18" rx="5" stroke="none"/><rect x="48" y="9" width="10" height="18" rx="5" stroke="none"/><circle cx="68" cy="68" r="20" stroke="none"/></g><g style="fill:var(--ic-pc,#FCFCFF);stroke:var(--ic-pc,#FCFCFF)"><rect x="20" y="9" width="10" height="18" rx="5" stroke="none"/><rect x="48" y="9" width="10" height="18" rx="5" stroke="none"/><circle cx="68" cy="68" r="20" stroke="none"/></g><g style="fill:url(#clay-light);stroke:url(#clay-light);opacity:var(--ic-light,1)"><rect x="20" y="9" width="10" height="18" rx="5" stroke="none"/><rect x="48" y="9" width="10" height="18" rx="5" stroke="none"/><circle cx="68" cy="68" r="20" stroke="none"/></g></g>
  <g style="fill:var(--ic-base,#20DCE2);stroke:var(--ic-base,#20DCE2)"><path d="M68 59 V77 M59 68 H77" fill="none" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round"/></g>
  <g class="hl" fill="#fff" style="opacity:var(--ic-hl,.5)"><rect x="-4.5" y="-3" width="9" height="6" rx="3" transform="translate(17 28) rotate(-20)"/></g>
</svg>
