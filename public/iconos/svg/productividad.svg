<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
<title>Productividad</title>
<desc>Icono clay OdontoFlow · azul. Colores por variables CSS --ic-*.</desc>
<defs>
<radialGradient id="clay-light" cx=".3" cy=".24" r=".78" fx=".28" fy=".18">
  <stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".4" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<filter id="clay-grain" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="1" seed="7" result="n"/>
  <feColorMatrix in="n" type="matrix" values="1.6 0 0 0 -0.3 1.6 0 0 0 -0.3 1.6 0 0 0 -0.3 0 0 0 0 1" result="g"/>
  <feComposite in="g" in2="SourceAlpha" operator="in" result="m"/>
  <feBlend in="m" in2="SourceGraphic" mode="soft-light"/>
</filter>
</defs>
  <g class="clay" style="filter:var(--ic-grain,url(#clay-grain))"><g transform="translate(1.6 2.4)" style="fill:var(--ic-dk,#0F58E8);stroke:var(--ic-dk,#0F58E8)"><rect x="12" y="52" width="20" height="31" rx="10" stroke="none"/><rect x="38" y="35" width="20" height="48" rx="10" stroke="none"/><rect x="64" y="15" width="20" height="68" rx="10" stroke="none"/></g><g style="fill:var(--ic-base,#258CFD);stroke:var(--ic-base,#258CFD)"><rect x="12" y="52" width="20" height="31" rx="10" stroke="none"/><rect x="38" y="35" width="20" height="48" rx="10" stroke="none"/><rect x="64" y="15" width="20" height="68" rx="10" stroke="none"/></g><g style="fill:url(#clay-light);stroke:url(#clay-light);opacity:var(--ic-light,1)"><rect x="12" y="52" width="20" height="31" rx="10" stroke="none"/><rect x="38" y="35" width="20" height="48" rx="10" stroke="none"/><rect x="64" y="15" width="20" height="68" rx="10" stroke="none"/></g></g>
  <g class="hl" fill="#fff" style="opacity:var(--ic-hl,.5)"><rect x="-5.0" y="-3" width="10" height="6" rx="3" transform="translate(70 28) rotate(-80)"/><rect x="-4.0" y="-3" width="8" height="6" rx="3" transform="translate(44 48) rotate(-80)"/></g>
</svg>
