<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
<title>Chat</title>
<desc>Icono clay OdontoFlow · cian. Colores por variables CSS --ic-*.</desc>
<defs>
<radialGradient id="clay-light" cx=".3" cy=".24" r=".78" fx=".28" fy=".18">
  <stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".4" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<filter id="clay-grain" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="1" seed="7" result="n"/>
  <feColorMatrix in="n" type="matrix" values="1.6 0 0 0 -0.3 1.6 0 0 0 -0.3 1.6 0 0 0 -0.3 0 0 0 0 1" result="g"/>
  <feComposite in="g" in2="SourceAlpha" operator="in" result="m"/>
  <feBlend in="m" in2="SourceGraphic" mode="soft-light"/>
</filter>
</defs>
  <g class="clay" style="filter:var(--ic-grain,url(#clay-grain))"><g transform="translate(1.6 2.4)" style="fill:var(--ic-dk,#0A9BE6);stroke:var(--ic-dk,#0A9BE6)"><rect x="10" y="14" width="76" height="54" rx="22" stroke="none"/><path d="M28 60 L22 82 L46 64 Z" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/></g><g style="fill:var(--ic-base,#42D6FF);stroke:var(--ic-base,#42D6FF)"><rect x="10" y="14" width="76" height="54" rx="22" stroke="none"/><path d="M28 60 L22 82 L46 64 Z" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/></g><g style="fill:url(#clay-light);stroke:url(#clay-light);opacity:var(--ic-light,1)"><rect x="10" y="14" width="76" height="54" rx="22" stroke="none"/><path d="M28 60 L22 82 L46 64 Z" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/></g></g>
  <g style="fill:var(--ic-ink,#020204);stroke:var(--ic-ink,#020204)"><rect x="-5.5" y="-10" width="11" height="20" rx="5.5" transform="translate(39 42) rotate(-14)" stroke="none"/><rect x="-5.5" y="-10" width="11" height="20" rx="5.5" transform="translate(58 38) rotate(-14)" stroke="none"/></g>
  <g class="hl" fill="#fff" style="opacity:var(--ic-hl,.5)"><rect x="-5.0" y="-3" width="10" height="6" rx="3" transform="translate(24 27) rotate(-35)"/></g>
</svg>
