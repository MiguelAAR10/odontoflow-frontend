<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
<title>Cobro</title>
<desc>Icono clay OdontoFlow · rosa. Colores por variables CSS --ic-*.</desc>
<defs>
<radialGradient id="clay-light" cx=".3" cy=".24" r=".78" fx=".28" fy=".18">
  <stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".4" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<filter id="clay-grain" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="1" seed="7" result="n"/>
  <feColorMatrix in="n" type="matrix" values="1.6 0 0 0 -0.3 1.6 0 0 0 -0.3 1.6 0 0 0 -0.3 0 0 0 0 1" result="g"/>
  <feComposite in="g" in2="SourceAlpha" operator="in" result="m"/>
  <feBlend in="m" in2="SourceGraphic" mode="soft-light"/>
</filter>
</defs>
  <g class="clay" style="filter:var(--ic-grain,url(#clay-grain))"><g transform="translate(1.6 2.4)" style="fill:var(--ic-dk,#D92376);stroke:var(--ic-dk,#D92376)"><circle cx="48" cy="48" r="36" stroke="none"/></g><g style="fill:var(--ic-base,#FA4091);stroke:var(--ic-base,#FA4091)"><circle cx="48" cy="48" r="36" stroke="none"/></g><g style="fill:url(#clay-light);stroke:url(#clay-light);opacity:var(--ic-light,1)"><circle cx="48" cy="48" r="36" stroke="none"/></g></g>
  <g style="stroke:var(--ic-on,#FCFCFF);fill:none"><path d="M59 36 C55 30 39 29 37 38 C35 47 59 46 59 57 C59 66 41 68 35 59 M48 24 V30 M48 66 V72" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/></g>
  <g class="hl" fill="#fff" style="opacity:var(--ic-hl,.5)"><rect x="-6.0" y="-3" width="12" height="6" rx="3" transform="translate(28 26) rotate(-45)"/></g>
</svg>
